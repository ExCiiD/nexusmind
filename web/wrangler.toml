# Ascend web companion, served by Cloudflare Workers static assets
# (Cloudflare's successor to Pages: same free tier, `_headers` supported).
# Deploy (after `npm run web:build` at the repo root), from this folder:
#   npx wrangler deploy
# Keeping this file here also stops wrangler's auto-configuration from
# editing the repo's package.json or creating a root vite config.
name = "nexusmind-web"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
