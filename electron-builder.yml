appId: com.ascend.app
productName: Ascend

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - node_modules/**/*
  - prisma-client/**/*
  - prisma/schema.prisma
  - prisma/migrations/**/*
  # Never read at runtime: transformers.js's default model cache, filled on
  # the build machine (147 MB of whisper-tiny; the app downloads whisper-base
  # into userData/whisper-cache), dependency source maps (~64 MB) and the
  # typecheck's tsbuildinfo files.
  - "!node_modules/@huggingface/transformers/.cache/**"
  - "!**/*.map"
  - "!out/*.tsbuildinfo"

# FFmpeg 8.1 bundled to enable the upstream ddagrab ACCESS_LOST recovery
# patch (feb 2024). ffmpeg-static 5.3.0 only ships 6.1.1, which is fatal to
# capture on any alt-tab / display mode transition.
extraResources:
  - from: resources/ffmpeg-bin/win-x64/ffmpeg.exe
    to: ffmpeg-bin/ffmpeg.exe

asarUnpack:
  - prisma-client/**/*
  - node_modules/ffmpeg-static/**/*
  # onnxruntime-node ships a prebuilt native .node binary per platform (used
  # by @huggingface/transformers for local Whisper transcription, Phase 5)
  # — native binaries can't load from inside an asar archive.
  - node_modules/onnxruntime-node/**/*
  - node_modules/onnxruntime-common/**/*

publish:
  provider: github
  # `prerelease` while in beta — flips the GitHub release flag automatically
  # so auto-updater clients on the stable channel don't pull it. Switch
  # back to `release` for the first 1.0 GA build.
  releaseType: prerelease

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  sign: false
  signingHashAlgorithms: []
  forceCodeSigning: false
  artifactName: Ascend-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ascend
