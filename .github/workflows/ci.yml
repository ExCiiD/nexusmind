name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Windows: the app, the bundled ffmpeg and the Prisma engine are Windows-only.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg-bin
          key: ffmpeg-8.1-${{ hashFiles('scripts/download-ffmpeg.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n consistency
        run: npm run check:i18n

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build web app
        run: npm run web:build

      - name: E2E tests (Electron)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
