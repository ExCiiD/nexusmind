name = "nexusmind-riot-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Public, non-secret settings.
[vars]
SUPABASE_URL = "https://zwubyzrfpelhxjjezvrh.supabase.co"
# P1-2: Riot's application limits for the key, "calls:seconds" (development key: 20/1 s and 100/2 min,
# kept a little under). Change it with the production key.
RIOT_APP_LIMITS = "18:1,95:120"
# P1-2: share of each window kept for interactive calls (end of game, open screen). Background calls
# (scout, synergy, sent with x-nxm-priority: background) use the rest.
INTERACTIVE_RESERVE = "0.3"
# CyberSecurity: most of each window one account may use, so a single user (or a stolen token) cannot empty
# the key for everyone. 0.25 of 95 calls / 2 min = 23 calls per user.
USER_WINDOW_SHARE = "0.25"
# #46 point 2: part of each player's share kept for their interactive calls: their background calls use at most 80 %
# of it (and always leave one slot), so an open screen never waits behind their own background reads.
USER_INTERACTIVE_RESERVE = "0.2"
# Cost guard of the R2 store (src/r2Guard.ts), asked by the user on 19/11/2026: at most this much above R2's free
# tier in a month (USD; 2 USD stays under 2 euros). Past it, the proxy stops using R2 until the next month.
R2_EXTRA_BUDGET_USD = "2"

# Per-player limit (Workers Rate Limiting binding). 20 calls/min with the development key (was 300, then 60:
# CyberSecurity, one account must not be able to drain the shared budget). Raise it with the production key.
[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# #46 point 2 (20/11/2026): background calls (weekly awards, scouts) also count here, 80 % of USER_LIMITER, so a
# player's interactive calls (an open screen) always find room in their minute. Keep it at 80 % of USER_LIMITER.
[[ratelimits]]
name = "USER_LIMITER_BACKGROUND"
namespace_id = "1002"
simple = { limit = 16, period = 60 }

# P1-2: the global budget, one Durable Object per Riot host (src/budgetObject.ts).
[[durable_objects.bindings]]
name = "RIOT_BUDGET"
class_name = "RiotBudgetObject"

[[migrations]]
tag = "v1-riot-budget"
new_sqlite_classes = ["RiotBudgetObject"]

# P1-1: finished games' match and timeline, shared by every user (src/cachePolicy.ts).
# On deployment, before the first deploy with this binding (CyberSecurity rules):
#   npx wrangler r2 bucket create nexusmind-riot-matches
#   npx wrangler r2 bucket lifecycle add nexusmind-riot-matches expire-90-days --expire-days 90
# The bucket stays PRIVATE: never turn on its r2.dev address nor attach a custom domain. Only this Worker
# reads it, through the binding. Check with: npx wrangler r2 bucket dev-url get nexusmind-riot-matches
[[r2_buckets]]
binding = "MATCH_STORE"
bucket_name = "nexusmind-riot-matches"

# P1-10: one data point per request (src/metrics.ts). Created on first write. Read with the SQL API, e.g.
#   SELECT blob1 AS endpoint, blob3 AS outcome, SUM(_sample_interval * double3) AS calls
#   FROM riot_proxy WHERE timestamp > NOW() - INTERVAL '1' DAY GROUP BY endpoint, outcome
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "riot_proxy"

# Secrets — set once with:
#   npx wrangler secret put RIOT_API_KEY
#   (only if the Supabase project uses legacy HS256 JWTs)
#   npx wrangler secret put SUPABASE_JWT_SECRET
